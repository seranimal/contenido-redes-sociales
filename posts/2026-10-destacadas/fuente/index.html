<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Destacadas · Ser Animal</title>
<style>
  @font-face { font-family: "Nunito"; font-weight: 900; src: url("../../../marca/fuentes/nunito-latin-900-normal.woff") format("woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url("../../../marca/fuentes/dm-sans-latin-500-normal.woff") format("woff"); }
  :root { --verde: #9ECA1B; --texto: #253027; --borde: #E5E9DE; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ddd; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: "DM Sans", sans-serif; }
  body.render { padding: 0; gap: 0; background: none; }

  /* Tapa de destacada: 1080×1920 (historia). Instagram la recorta en círculo desde el centro,
     así que el ícono va centrado y ocupa un 44 % del ancho. */
  .tapa { width: 1080px; height: 1920px; background: var(--verde); display: grid; place-items: center; flex: none; }
  .tapa img { width: 480px; height: 480px; }

  /* Vista previa del perfil (portada.jpg, 1080×1350). */
  .vista { width: 1080px; height: 1350px; background: #fff; flex: none; padding: 90px 70px 0; color: var(--texto); }
  .vista h1 { font: 900 64px/1.1 "Nunito", sans-serif; text-align: center; }
  .vista p { font-size: 32px; text-align: center; margin-top: 18px; color: #444D45; }
  .vista .grilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px 0; margin-top: 90px; }
  .vista .d { text-align: center; font-size: 34px; font-weight: 500; }
  .vista .anillo { width: 230px; height: 230px; margin: 0 auto 20px; border-radius: 50%; border: 3px solid var(--borde); padding: 10px; }
  .vista .anillo div { width: 100%; height: 100%; border-radius: 50%; background: var(--verde); display: grid; place-items: center; }
  .vista .anillo img { width: 44%; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  const DESTACADAS = [
    ['sucursales', 'Sucursales', 'tienda'],
    ['clientes', 'Clientes', 'personas'],
    ['eventos', 'Eventos', 'calendario'],
    ['consejos', 'Consejos', 'bombilla'],
    ['brit', 'Brit', 'bolsa'],
    ['kong', 'Kong', 'rellenable'],
    ['benebone', 'Benebone', 'hueso'],
    ['carnilove', 'Carnilove', 'plato'],
    ['adopciones', 'Adopciones', 'adopcion'],
  ];
  const icono = (n) => `../../../marca/elementos/svg/icono-${n}-blanco.svg`;
  const raiz = document.getElementById('raiz');
  if (location.search.includes('render')) document.body.classList.add('render');
  raiz.outerHTML =
    DESTACADAS.map(([clave, , ic]) => `<div class="tapa" data-clave="${clave}"><img src="${icono(ic)}" alt=""></div>`).join('') +
    `<div class="vista"><h1>Destacadas de @seranimal</h1><p>Se ven así en el perfil, en este orden.</p><div class="grilla">` +
    DESTACADAS.map(([, nombre, ic]) => `<div class="d"><div class="anillo"><div><img src="${icono(ic)}" alt=""></div></div>${nombre}</div>`).join('') +
    `</div></div>`;
</script>
</body>
</html>
