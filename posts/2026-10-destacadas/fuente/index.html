<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Destacadas · Ser Animal</title>
<style>
  @font-face { font-family: "Nunito"; font-weight: 900; src: url("../../../marca/fuentes/nunito-latin-900-normal.woff") format("woff"); }
  @font-face { font-family: "DM Sans"; font-weight: 500; src: url("../../../marca/fuentes/dm-sans-latin-500-normal.woff") format("woff"); }
  :root { --verde: #9ECA1B; --texto: #253027; --superficie: #F8FAF4; --borde: #E5E9DE; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ddd; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: "DM Sans", sans-serif; }
  body.render { padding: 0; gap: 0; background: none; }

  /* Sistema «anillo»: Instagram muestra la tapa como un círculo, así que la composición es un
     anillo verde Ser Animal de borde a borde, un disco blanco adentro y, en el disco, el logo de
     la marca o una foto real con una insignia verde con el ícono de línea. */
  .historia { width: 1080px; height: 1920px; background: var(--superficie); display: grid; place-items: center; flex: none; }
  .tapa { width: 1080px; height: 1080px; background: var(--superficie); position: relative; flex: none; }
  .anillo { position: absolute; inset: 0; border-radius: 50%; background: var(--verde); display: grid; place-items: center; }
  .disco { width: 960px; height: 960px; border-radius: 50%; background: #fff; overflow: hidden; display: grid; place-items: center; position: relative; }
  .disco img.logo { max-width: 700px; max-height: 320px; }
  .disco img.foto { width: 100%; height: 100%; object-fit: cover; }
  .insignia { position: absolute; left: 50%; top: 960px; width: 230px; height: 230px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--verde); border: 14px solid #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(37, 48, 39, 0.18); }
  .insignia img { width: 118px; height: 118px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  // [clave, nombre, {logo} o {foto, posicion, icono}]
  const DESTACADAS = [
    ['sucursales', 'Sucursales', { foto: 'sucursales.jpg', posicion: '58% 52%', icono: 'tienda' }],
    ['clientes', 'Clientes', { foto: 'clientes.jpg', posicion: '50% 40%', icono: 'personas' }],
    ['eventos', 'Eventos', { foto: 'eventos.jpg', posicion: '38% 22%', icono: 'calendario' }],
    ['consejos', 'Consejos', { foto: 'consejos.jpg', posicion: '62% 45%', icono: 'bombilla' }],
    ['brit', 'Brit', { logo: 'brit.svg', ancho: 600 }],
    ['kong', 'Kong', { logo: 'kong.svg', ancho: 640 }],
    ['benebone', 'Benebone', { logo: 'benebone.png', ancho: 700 }],
    ['carnilove', 'Carnilove', { logo: 'carnilove.svg', ancho: 640 }],
    ['adopciones', 'Adopciones', { foto: 'adopciones.jpg', posicion: '50% 42%', icono: 'adopcion' }],
  ];
  if (location.search.includes('render')) document.body.classList.add('render');
  const tapa = ([clave, , d]) => {
    const interior = d.logo
      ? `<img class="logo" src="logos/${d.logo}" style="width:${d.ancho}px" alt="">`
      : `<img class="foto" src="fotos/${d.foto}" style="object-position:${d.posicion}" alt="">`;
    const insignia = d.icono ? `<div class="insignia"><img src="../../../marca/elementos/svg/icono-${d.icono}-blanco.svg" alt=""></div>` : '';
    return `<div class="historia" data-clave="${clave}"><div class="tapa"><div class="anillo"><div class="disco">${interior}</div></div>${insignia}</div></div>`;
  };
  document.getElementById('raiz').outerHTML = DESTACADAS.map(tapa).join('');
</script>
</body>
</html>
