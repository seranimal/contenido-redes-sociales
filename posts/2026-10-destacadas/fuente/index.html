<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Destacadas · Ser Animal</title>
<style>
  :root { --verde: #9ECA1B; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #ddd; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  body.render { padding: 0; gap: 0; background: none; }

  /* Sistema de las tapas: fondo verde Ser Animal y todo en blanco. En las de marcas, el logo
     oficial en blanco; en Sucursales, el logo de Ser Animal; en las de temas, el ícono de línea
     grueso de marca/elementos. Instagram muestra la tapa en un círculo, así que todo va centrado
     y ocupa como mucho el 67 % del ancho. */
  .historia { width: 1080px; height: 1920px; background: var(--verde); display: grid; place-items: center; flex: none; }
  .tapa { width: 1080px; height: 1080px; background: var(--verde); display: grid; place-items: center; flex: none; }
  .tapa img.logo { max-width: 720px; max-height: 340px; }
  .tapa img.icono { width: 480px; height: 480px; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
  // [clave, nombre, {logo, ancho} o {icono}]. Los logos blancos se generan con fuente/logos-blancos.py.
  const DESTACADAS = [
    ['sucursales', 'Sucursales', { logo: '../../../marca/logo/logo-blanco.svg', ancho: 720 }],
    ['clientes', 'Clientes', { icono: 'personas' }],
    ['eventos', 'Eventos', { icono: 'calendario' }],
    ['consejos', 'Consejos', { icono: 'bombilla' }],
    ['brit', 'Brit', { logo: 'logos/brit-blanco.svg', ancho: 600 }],
    ['kong', 'Kong', { logo: 'logos/kong-blanco.svg', ancho: 640 }],
    ['benebone', 'Benebone', { logo: 'logos/benebone-blanco.png', ancho: 720 }],
    ['carnilove', 'Carnilove', { logo: 'logos/carnilove-blanco.svg', ancho: 640 }],
    ['adopciones', 'Adopciones', { icono: 'adopcion' }],
  ];
  if (location.search.includes('render')) document.body.classList.add('render');
  const tapa = ([clave, , d]) => {
    const interior = d.logo
      ? `<img class="logo" src="${d.logo}" style="width:${d.ancho}px" alt="">`
      : `<img class="icono" src="../../../marca/elementos/svg/icono-${d.icono}-blanco-grueso.svg" alt="">`;
    return `<div class="historia" data-clave="${clave}"><div class="tapa">${interior}</div></div>`;
  };
  document.getElementById('raiz').outerHTML = DESTACADAS.map(tapa).join('');
</script>
</body>
</html>
